spring:
  config:
    import: "optional:file:.env[.properties]"
  threads:
    virtual:
      enabled: true  # Java 21 virtual threads for Tomcat and applicationTaskExecutor (parallel AI calls)
  datasource:
    url: jdbc:postgresql://ep-odd-flower-ae12er96-pooler.c-2.us-east-2.aws.neon.tech/neondb?sslmode=require
    username: ${DB_USER}
    password: ${DB_PASSWD}
  flyway:
    schemas: v2
    default-schema: v2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: v2
  cache:
    type: redis  # explicit: fail at startup instead of silently falling back to an in-memory cache
  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
      password: ${REDIS_PASSWD}
      ssl:
        enabled: true
  ai:
    model:
      audio:
        speech: none
        transcription: none
      embedding: none
      image: none
      moderation: none
    vectorstore:
      type: none
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      chat:
        # fail fast so the fallback gets its turn (defaults: 3 retries, 60s). 2 attempts x 20s per provider,
        # x 2 providers = 80s, inside insightshub.ai.task-timeout (90s), so no HTTP call outlives its task.
        max-retries: 1
        timeout: 20s
        options:
          model: openai/gpt-oss-120b  # v1's llama-3.3-70b-versatile is retired on Groq (B26)
insightshub:
  frontend-url: ${FRONTEND_URL}
  backend-url: ${BACKEND_URL}
  jwt-secret: ${JWT_SECRET}
  encryption-key: ${ENCRYPTION_KEY}  # Base64 of 32 random bytes: openssl rand -base64 32
  auth:  # GitHub OAuth App; callback URL must be ${BACKEND_URL}/api/auth/callback
    github-client-id: ${GITHUB_CLIENT_ID}
    github-client-secret: ${GITHUB_CLIENT_SECRET}
    scopes: "read:user user:email"  # public data + verified email; no `repo` (the token is stored)
    token-ttl: 24h
    redirect-to-frontend: false  # true = v1 behaviour (FRONTEND_URL/dashboard?token=...)
  sync:
    login-stale-after: 7d  # v1: re-sync at login only when the data is older than a week
  ai:
    fast-model: openai/gpt-oss-20b  # cheap model for repo summaries (v1: llama-3.1-8b-instant, retired)
    reasoning-effort: low  # gpt-oss reasons before answering; "low" keeps that short
    task-timeout: 90s
    fallback:  # OpenAI-compatible Gemini endpoint; switched off while GEMINI_API_KEY is empty
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.6-flash}
management:
  endpoint:
    health:
      show-details: when-authorized  # anonymous callers get only UP/DOWN; a valid JWT sees DB/Redis details