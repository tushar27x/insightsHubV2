spring:
  config:
    import: "optional:file:.env[.properties]"
  threads:
    virtual:
      enabled: true  # Java 21 virtual threads for Tomcat and applicationTaskExecutor (parallel AI calls)
  datasource:
    url: jdbc:postgresql://ep-odd-flower-ae12er96-pooler.c-2.us-east-2.aws.neon.tech/neondb?sslmode=require
    username: ${DB_USER}
    password: ${DB_PASSWD}
  flyway:
    schemas: v2
    default-schema: v2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: v2
  cache:
    type: redis  # explicit: fail at startup instead of silently falling back to an in-memory cache
  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
      password: ${REDIS_PASSWD}
      ssl:
        enabled: true
      # Fail fast instead of Lettuce's 60 s default, so a Redis outage costs a request
      # at most 2 s before the rate limiter fails open and the cache is skipped.
      timeout: 2s
      connect-timeout: 2s
  ai:
    model:
      audio:
        speech: none
        transcription: none
      embedding: none
      image: none
      moderation: none
    vectorstore:
      type: none
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      chat:
        # fail fast so the fallback gets its turn (defaults: 3 retries, 60s). 2 attempts x 20s per provider,
        # x 2 providers = 80s, inside insightshub.ai.task-timeout (90s), so no HTTP call outlives its task.
        max-retries: 1
        timeout: 20s
        options:
          model: openai/gpt-oss-120b  # v1's llama-3.3-70b-versatile is retired on Groq (B26)
insightshub:
  frontend-url: ${FRONTEND_URL}
  backend-url: ${BACKEND_URL}
  jwt-secret: ${JWT_SECRET}
  encryption-key: ${ENCRYPTION_KEY}  # Base64 of 32 random bytes: openssl rand -base64 32
  auth:  # GitHub OAuth App; callback URL must be ${BACKEND_URL}/api/auth/callback
    github-client-id: ${GITHUB_CLIENT_ID}
    github-client-secret: ${GITHUB_CLIENT_SECRET}
    scopes: "read:user user:email"  # public data + verified email; no `repo` (the token is stored)
    token-ttl: 24h
    redirect-to-frontend: true  # FRONTEND_URL/dashboard#token=... for the web app; false = the token as JSON
  rate-limit:  # fixed windows in Redis (v2:rl:*); fails open if Redis is down
    enabled: true
    policies:
      login: { requests: 5, per: 1m }      # per IP (v1)
      callback: { requests: 5, per: 1m }   # per IP (v1)
      insights: { requests: 20, per: 1m }  # per user (v1)
      hero: { requests: 60, per: 1m }      # per user, GET /hero and /hero/events together
      preferences: { requests: 20, per: 1m }  # per user, GET and PUT /preferences together
      hero-class: { requests: 10, per: 1m }   # per user, PUT /hero/class (the 7-day cooldown is separate)
      sync-global: { requests: 30, per: 1m }  # all users together: protects the shared Groq key; tune to the plan
  sync:
    min-interval: 10m  # per-user cooldown for login/refresh syncs, the only ones that call the LLM (v1: 7 days, login only)
    cron: "0 0 3 * * *"  # daily activity-only refresh of every user, no LLM calls, in UTC (Spring cron: sec min hour day month weekday; "-" = off)
    concurrency: 4  # users refreshed at once by the daily job (GitHub on each user's own token + DB writes)
    branch-scan-days: 2  # today and yesterday: days the calendar shows as empty get a branch scan
  hero:
    cron: "0 5 * * * *"  # hourly, 5 past, in UTC: settles each hero's days from 06:00 local ("-" = off)
    concurrency: 4  # heroes refreshed (GitHub, the user's own token) and settled at once
    qualify-score: 40  # a class scoring at least this can be chosen; the top class always can
    class-cooldown: 7d  # between class changes
  ai:
    fast-model: openai/gpt-oss-20b  # cheap model for repo summaries (v1: llama-3.1-8b-instant, retired)
    reasoning-effort: low  # gpt-oss reasons before answering; "low" keeps that short
    task-timeout: 90s
    fallback:  # OpenAI-compatible Gemini endpoint; switched off while GEMINI_API_KEY is empty
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.6-flash}
management:
  endpoint:
    health:
      show-details: when-authorized  # anonymous callers get only UP/DOWN; a valid JWT sees DB/Redis details
logging:
  level:
    com.tushar27x.insightshub: INFO  # the app's own logs carry no tokens or secrets at any level (B30)
    # These log secrets at DEBUG/TRACE, so they stay at WARN even if root is raised while debugging:
    org.hibernate.orm.jdbc.bind: WARN  # SQL parameter values: encrypted GitHub tokens, emails
    org.springframework.web.HttpLogging: WARN  # message bodies: the OAuth form (client secret) and token response
    org.springframework.web.client: WARN  # request details of the GitHub and LLM calls
    org.springframework.security.oauth2: WARN  # token validation details
