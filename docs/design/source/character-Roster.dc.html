<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Class roster</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=VT323&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f2b632}a:hover{color:#ffd36b}
</style>
</helmet>
<div style="width: 1440px; height: 1000px; box-sizing: border-box; padding: 56px 64px; background-color: #13111c; background-image: radial-gradient(#1d1a2b 1px, transparent 1px); background-size: 8px 8px; font-family: 'VT323', monospace; color: #f4ecd8; display: flex; flex-direction: column; gap: 32px">
  <header style="display: flex; justify-content: space-between; align-items: flex-end; gap: 24px">
    <div style="display: flex; flex-direction: column; gap: 14px">
      <h1 style="margin: 0; font-family: 'Press Start 2P', monospace; font-size: 24px; line-height: 1.3; color: #f2b632; text-shadow: 4px 4px 0 #0a0910">CHOOSE YOUR CLASS</h1>
      <p style="margin: 0; font-size: 26px; color: #c9c0dc">The backend scores all 8 from your GitHub habits. The highest score is your class.</p>
    </div>
    <p style="margin: 0; font-family: 'Press Start 2P', monospace; font-size: 10px; color: #8d84a6; letter-spacing: 1px">ALGO v1 · 16×16 SPRITES</p>
  </header>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 32px">
    <sc-for list="{{classes}}" as="c" hint-placeholder-count="8">
      <article style="background: #221e33; box-shadow: 0 0 0 4px #0a0910, 6px 6px 0 4px #0a0910; display: flex; flex-direction: column">
        <div style="height: 10px; background: {{c.accent}}"></div>
        <div style="height: 176px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 14px; background: linear-gradient(#2a2540, #2a2540 70%, #1a1727 70%); position: relative">
          <div style="display: flex; flex-direction: column; align-items: center">
            <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(16, 8px); grid-auto-rows: 8px">
              <sc-for list="{{c.px}}" as="p"><div style="background: {{p.fill}}"></div></sc-for>
            </div>
            <div aria-hidden="true" style="width: 112px; height: 12px; background: #4a4466; box-shadow: 0 4px 0 #0a0910; margin-top: 2px"></div>
          </div>
          <span style="position: absolute; top: 14px; right: 14px; font-family: 'Press Start 2P', monospace; font-size: 9px; color: #8d84a6">{{c.num}}</span>
        </div>
        <div style="padding: 18px 20px 22px; display: flex; flex-direction: column; gap: 10px">
          <h2 style="margin: 0; font-family: 'Press Start 2P', monospace; font-size: 14px; color: {{c.accent}}">{{c.name}}</h2>
          <p style="margin: 0; font-size: 22px; line-height: 1.05; color: #f4ecd8; min-height: 46px">{{c.habit}}</p>
          <p style="margin: 0; font-size: 19px; line-height: 1.1; color: #a69dbd">SCORED ON · {{c.signals}}</p>
        </div>
      </article>
    </sc-for>
  </div>
</div>
</x-dc>

};
function pixels(name) {
  var pal = Object.assign({}, BASE, PAL[name]);
  var out = [];
  SPRITES[name].forEach(function (r) {
    var row = (r + '................').slice(0, 16);
    for (var x = 0; x < 16; x++) {
      var c = row[x];
      out.push({ fill: pal[c] || 'transparent' });
    }
  });
  return out;
}
