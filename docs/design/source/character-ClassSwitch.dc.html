<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Change class, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=VT323&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f2b632}a:hover{color:#ffd36b}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #13111c; font-family: 'VT323', monospace; color: #f4ecd8; overflow: hidden">
  <header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #221e33; box-shadow: 0 4px 0 #0a0910">
    <a href="#" style="font-family: 'Press Start 2P', monospace; font-size: 10px; text-decoration: none; padding: 12px 0">◀ HERO</a>
    <h1 style="margin: 0; font-family: 'Press Start 2P', monospace; font-size: 11px">CHANGE CLASS</h1>
    <span style="width: 56px"></span>
  </header>
  <section style="height: 176px; flex-shrink: 0; display: flex; align-items: center; gap: 18px; padding: 0 20px; background: linear-gradient(#1a1630, #1a1630 74%, #241e40 74%)">
    <div style="display: flex; flex-direction: column; align-items: center">
      <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(16, 6px); grid-auto-rows: 6px">
        <sc-for list="{{preview.px}}" as="p"><span style="background: {{p.fill}}"></span></sc-for>
      </div>
      <div aria-hidden="true" style="width: 112px; height: 10px; background: #4a4466; box-shadow: 0 4px 0 #0a0910"></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <span style="font-family: 'Press Start 2P', monospace; font-size: 14px; color: {{preview.accent}}">{{preview.name}}</span>
      <span style="font-size: 20px; line-height: 1.05; color: #c9c0dc">{{preview.habit}}</span>
    </div>
  </section>
  <ul style="list-style: none; margin: 0; padding: 14px 12px 0; display: flex; flex-direction: column; gap: 6px; flex: 1">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
      <li>
        <button type="button" disabled="{{r.locked}}" onClick="{{r.pick}}" aria-pressed="{{r.selected}}" style="width: 100%; height: 44px; display: grid; grid-template-columns: 32px 104px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 0 10px; border: 0; cursor: {{r.cursor}}; font-family: inherit; color: inherit; text-align: left; background: {{r.bg}}; box-shadow: {{r.ring}}; opacity: {{r.opacity}}">
          <span aria-hidden="true" style="display: grid; grid-template-columns: repeat(16, 2px); grid-auto-rows: 2px">
            <sc-for list="{{r.px}}" as="p"><span style="background: {{p.fill}}"></span></sc-for>
          </span>
          <span style="font-family: 'Press Start 2P', monospace; font-size: 9px; color: {{r.accent}}">{{r.name}}</span>
          <span style="font-size: 20px; color: #c9c0dc">{{r.score}}</span>
          <span style="font-family: 'Press Start 2P', monospace; font-size: 7px; color: {{r.tagInk}}">{{r.tag}}</span>
        </button>
      </li>
    </sc-for>
  </ul>
  <footer style="padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 10px">
    <button type="button" disabled="{{confirm.disabled}}" style="width: 100%; padding: 16px 0; border: 0; font-family: 'Press Start 2P', monospace; font-size: 11px; color: {{confirm.ink}}; background: {{confirm.bg}}; box-shadow: {{confirm.ring}}; cursor: pointer">{{confirm.label}}</button>
    <p style="margin: 0; font-size: 19px; line-height: 1.05; color: #a69dbd; text-align: center">You keep LV 7 and your hearts. After switching, the next change opens in 7 days.</p>
  </footer>
  <nav aria-label="Main" style="height: 64px; flex-shrink: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #221e33; box-shadow: 0 -4px 0 #0a0910">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; text-decoration: none; color: {{t.color}}; background: {{t.bg}}; font-family: 'Press Start 2P', monospace; font-size: 7px">
        <span aria-hidden="true" style="width: 14px; height: 14px; background: {{t.color}}; box-shadow: 0 0 0 2px #0a0910"></span>
        {{t.label}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var SPRITES = {
  PALADIN: ["................","......kkkk......",".....kmmmmk.....","....kmmmmmmk....","....kmkkkkmk....","....kmmmmmmk....","....kmmggmmk....",".....kkkkkk.....",".kkk.kaaaak..m..","kbbbkaagaaak.m..","kbgbkaggggak.m..","kbbbkaagaaakkgk.",".kbk.kaaaak..k..","..k..kmkkmk.....",".....kmk.kmk....",".....kkk.kkk...."],
  BARBARIAN: ["....hhhhhhh.....","...hhhhhhhhh....","...hkssssskh..mm","...hksksskshmmmm","....kssssssk.mmm","....kslllssk..l.",".....kssssk...l.","...kksssssskk.l.","..ksssssssssskl.","..kskssssssksk..","..ks.kllllk.sk..",".....kgggk......",".....kllllk.....",".....ksk.ksk....",".....ksk.ksk....","....kkk...kkk..."],
  WIZARD: [".......k........","......kak.......","......kagk......",".....kaaak......","....kaagaak...g.","..kkaaaaaaakk.k.","....kskssksk..l.","....kssssssk..l.","....kwwwwwwk..l.","...kawwwwwwak.l.","..kaaawwwwaaakl.","..kaaaawwaaaaks.","..kaaagaagaaak..","..kaaaaaaaaaak..","..kbbbbbbbbbbk..","...kkkkkkkkkk..."],
  ARTIFICER: ["................",".....kkkkkk.....","....khhhhhhk....","...kmmkhhkmmk...","...kmgmkkmgmk...","....kssssssk....","....kskssksk....",".....kssssk.....","...kklllllkk.m..","..kalaaaaalak.m.","..kalaggaalakmmm","..ksklaaalksk.m.","....klllllk.....","....kbbkbbk.....","....kbk.kbk.....","...kkk...kkk...."],
  CLERIC: ["....gggggggg....","...g........g...","...kkkkkkkkkk...","..kwwwwwwwwwwk..","..kwwaaaaaawwk..","..kwksssssskwk..","..kwksksskskwk..","..kwksssssskwk..","...kwkkkkkkwk...","..kwwwaggawwwk..",".kswwaggggawwsk.","..kwwwaggawwwk..","..kwwwaaaawwwk..","...kwwwwwwwwk...","..kaaaaaaaaaak..","....kkkkkkkk...."],
  BARD: [".........xx.....","......kkkxk.....",".....kaaaakk....","....kaaaaaaak...","....khssssshk...","....kskssksk....","....kssssssk....",".....kssssk.....","...kkaawwaakk...","..kbaawwwwaabk..",".kllllkwwaaabk..","kllgglk.aaabk...","klgggllkaaabk...",".kllllk.kbbk....","..kkkk..kbkbk...",".......kkk.kkk.."],
  MONK: ["................",".....kkkkkk.....","....kssssssk....","....kssssssk....","....kskssksk....","....kssssssk....",".....kskksk.....","......kssk......","...kkaaaabbkk...","..kaaaaabbaaak..","..kaasskbaaaak..","..kaasskbaaaak..","...kaaabbaaak...","...kaaaaaaaak...","....kaaaaaak....","....kkk..kkk...."],
  ROGUE: ["......kkkk......",".....kaaaak.....","....kaaaaaak....","...kaabbbbaak...","...kabkkkkbak...","...kabgkkgbak...","...kabbbbbbak...","....kaabbaak....","...kkaaaaaakk...","..kaaabbbbaaak..",".mkaaabbbbaaakm.","m.ksaabbbbaask.m","...kaaabbaaak...","...kbbkkkkbbk...","...kbk....kbk...","..kkk......kkk.."]
};
var BASE = { k: '#1a1410', s: '#f0c08a', w: '#f4ecd8', m: '#c9ced6', g: '#f2b632' };
var PAL = {
  PALADIN: { a: '#3d6fc9', b: '#8a5a32' }, BARBARIAN: { h: '#d2532a', l: '#6b4226' }, WIZARD: { a: '#6a4bc4', b: '#3f2c80', l: '#8a5a32' },
  ARTIFICER: { h: '#5a3a22', m: '#9aa7b4', g: '#7fd4e6', l: '#8a5a32', a: '#b5652a', b: '#3d3a4f' }, CLERIC: { a: '#2fa39a' },
  BARD: { a: '#c43c62', b: '#7a1f3d', h: '#7a4a2a', l: '#b07a3c', g: '#e6c27a', x: '#f2b632' }, MONK: { a: '#e0812f', b: '#8a3b1a' }, ROGUE: { a: '#3b4a3f', b: '#1f2622', g: '#e8d25a' }
};
var ACCENT = { PALADIN: '#6c9cf0', BARBARIAN: '#ef7a52', WIZARD: '#a98cf0', ARTIFICER: '#e3a15a', CLERIC: '#4fcfc1', BARD: '#ef7099', MONK: '#f5c04a', ROGUE: '#9fc39f' };
var HABIT = {
  PALADIN: 'Keeps an oath of daily commits: consistent, unbroken streaks', BARBARIAN: 'Charges in with huge pull requests and bursts of activity',
  WIZARD: 'Masters many languages across their projects', ARTIFICER: 'Builds the machinery: Docker, CI, infrastructure as code',
  CLERIC: 'Heals codebases: reports issues and lands fixes', BARD: 'Works through pull requests, documents well and draws an audience',
  MONK: 'Disciplined: small pull requests and descriptive commit messages', ROGUE: 'Strikes from the shadows, doing much of their work on weekends'
};
function pixels(name) {
  var pal = Object.assign({}, BASE, PAL[name]);
  var out = [];
  SPRITES[name].forEach(function (r) {
    var row = (r + '................').slice(0, 16);
    for (var x = 0; x < 16; x++) out.push({ fill: pal[row[x]] || 'transparent' });
  });
  return out;
}
var SCORES = { MONK: 52, ROGUE: 47, PALADIN: 44, BARBARIAN: 44, WIZARD: 33, ARTIFICER: 33, BARD: 10, CLERIC: 0 };
var ORDER = ['PALADIN','BARBARIAN','WIZARD','ARTIFICER','CLERIC','BARD','MONK','ROGUE'];
var CURRENT = 'MONK';
var THRESHOLD = 40;
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: 'ROGUE' }; }
  renderVals() {
    var self = this;
    var picked = this.state.picked;
    var sorted = ORDER.slice().sort(function (a, b) { return (SCORES[b] - SCORES[a]) || (ORDER.indexOf(a) - ORDER.indexOf(b)); });
    var top = sorted[0];
    var rows = sorted.map(function (n) {
      var qualified = SCORES[n] >= THRESHOLD || n === top;
      var isCurrent = n === CURRENT, isPicked = n === picked;
      return {
        name: n, score: SCORES[n], accent: qualified ? ACCENT[n] : '#8d84a6', px: pixels(n),
        locked: !qualified, selected: isPicked ? 'true' : 'false', cursor: qualified ? 'pointer' : 'not-allowed', opacity: qualified ? '1' : '0.55',
        bg: isPicked ? '#2e2945' : '#221e33', ring: isPicked ? '0 0 0 3px #f2b632' : '0 0 0 2px #0a0910',
        tag: isCurrent ? 'CURRENT' : (qualified ? 'QUALIFIED' : 'NEEDS ' + THRESHOLD), tagInk: isCurrent ? '#f2b632' : (qualified ? '#9fc39f' : '#8d84a6'),
        pick: function () { if (qualified) self.setState({ picked: n }); }
      };
    });
    var same = picked === CURRENT;
    return {
      preview: { px: pixels(picked), name: picked, accent: ACCENT[picked], habit: HABIT[picked] },
      rows: rows,
      confirm: same
        ? { disabled: true, label: 'THIS IS YOUR CLASS', ink: '#8d84a6', bg: '#2e2945', ring: '0 0 0 3px #0a0910' }
        : { disabled: false, label: 'BECOME ' + picked, ink: '#1a1410', bg: '#f2b632', ring: '0 0 0 3px #0a0910, 4px 4px 0 3px #0a0910' },
      tabs: [
        { label: 'HOME', color: '#a69dbd', bg: 'transparent' },
        { label: 'JOURNAL', color: '#a69dbd', bg: 'transparent' },
        { label: 'HERO', color: '#f2b632', bg: '#2e2945' },
        { label: 'ARENA', color: '#a69dbd', bg: 'transparent' },
        { label: 'SETTINGS', color: '#a69dbd', bg: 'transparent' }
      ]
    };
  }
}
</script>
</body>
</html>
