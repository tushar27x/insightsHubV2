<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Journal, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=VT323&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f2b632}a:hover{color:#ffd36b}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #13111c; font-family: 'VT323', monospace; color: #f4ecd8; overflow: hidden">
  <header style="flex-shrink: 0; position: relative; z-index: 2; padding: 16px 16px 12px; background: #221e33; box-shadow: 0 4px 0 #0a0910; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h1 style="margin: 0; font-family: 'Press Start 2P', monospace; font-size: 14px; color: #f2b632">JOURNAL</h1>
      <span style="font-size: 18px; color: #a69dbd">Your last 12 months</span>
    </div>
    <div role="tablist" aria-label="Journal sections" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <button type="button" role="tab" aria-selected="true" style="height: 36px; border: 0; font-family: 'Press Start 2P', monospace; font-size: 8px; color: #1a1410; background: #f2b632; box-shadow: 0 0 0 2px #0a0910; cursor: pointer">STATS</button>
      <button type="button" role="tab" aria-selected="false" style="height: 36px; border: 0; font-family: 'Press Start 2P', monospace; font-size: 8px; color: #c9c0dc; background: #2e2945; box-shadow: 0 0 0 2px #0a0910; cursor: pointer">REPOS</button>
      <button type="button" role="tab" aria-selected="false" style="height: 36px; border: 0; font-family: 'Press Start 2P', monospace; font-size: 8px; color: #c9c0dc; background: #2e2945; box-shadow: 0 0 0 2px #0a0910; cursor: pointer">REVIEWS</button>
    </div>
  </header>
  <main style="flex: 1; overflow: hidden; padding: 18px 12px 12px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
        <div style="background: #221e33; box-shadow: 0 0 0 3px #0a0910; padding: 12px 12px 10px; display: flex; flex-direction: column; gap: 6px">
          <span style="font-family: 'Press Start 2P', monospace; font-size: 7px; color: #a69dbd">{{s.label}}</span>
          <span style="font-family: 'Press Start 2P', monospace; font-size: 18px; color: {{s.ink}}">{{s.value}}</span>
        </div>
      </sc-for>
    </div>
    <section style="background: #221e33; box-shadow: 0 0 0 3px #0a0910; padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-family: 'Press Start 2P', monospace; font-size: 8px">LAST 28 DAYS</h2>
        <span style="font-size: 18px; color: #a69dbd">18 active</span>
      </div>
      <div role="img" aria-label="Contribution calendar for the last 28 days, 18 active days" style="display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 4px">
        <sc-for list="{{cal}}" as="c"><span style="aspect-ratio: 1; background: {{c.fill}}; box-shadow: 0 0 0 1px #0a0910"></span></sc-for>
      </div>
    </section>
    <section style="background: #221e33; box-shadow: 0 0 0 3px #0a0910; padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-family: 'Press Start 2P', monospace; font-size: 8px">TOP REPOS</h2>
      <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{repos}}" as="r" hint-placeholder-count="3">
          <li style="display: grid; grid-template-columns: 120px minmax(0, 1fr) 30px; align-items: center; gap: 10px">
            <span style="font-size: 19px; line-height: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.name}}</span>
            <span style="height: 10px; background: #2e2945; display: block"><span style="display: block; height: 10px; width: {{r.pct}}%; background: #f2b632"></span></span>
            <span style="font-size: 19px; text-align: right; color: #c9c0dc">{{r.count}}</span>
          </li>
        </sc-for>
      </ol>
    </section>
    <section style="background: #efe0bb; color: #2a1d12; padding: 12px 14px; box-shadow: 0 0 0 3px #0a0910, inset 0 0 0 3px #c9b48a; display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 0; font-family: 'Press Start 2P', monospace; font-size: 8px; color: #6b3d16">YEAR IN REVIEW</h2>
      <p style="margin: 0; font-size: 20px; line-height: 1.05">[AI year in review, first two lines, then fades into READ MORE.]</p>
      <a href="#" style="align-self: flex-end; font-family: 'Press Start 2P', monospace; font-size: 7px; color: #6b3d16; text-decoration: none; padding: 6px 0">READ MORE ▶</a>
    </section>
  </main>
  <nav aria-label="Main" style="height: 64px; flex-shrink: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #221e33; box-shadow: 0 -4px 0 #0a0910">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; text-decoration: none; color: {{t.color}}; background: {{t.bg}}; font-family: 'Press Start 2P', monospace; font-size: 7px">
        <span aria-hidden="true" style="width: 14px; height: 14px; background: {{t.color}}; box-shadow: 0 0 0 2px #0a0910"></span>
        {{t.label}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var COUNTS = [2,5,0,3,1,0,0,4,6,2,0,1,3,0,0,2,7,3,1,0,0,5,2,3,4,0,1,0];
var SHADES = ['#2e2945', '#7a5a22', '#b8862a', '#f2b632'];
class Component extends DCLogic {
  renderVals() {
    return {
      stats: [
        { label: 'COMMITS', value: '412', ink: '#f2b632' },
        { label: 'PULL REQUESTS', value: '37', ink: '#f4ecd8' },
        { label: 'ISSUES', value: '9', ink: '#f4ecd8' },
        { label: 'STARS', value: '18', ink: '#f4ecd8' }
      ],
      cal: COUNTS.map(function (n) { return { fill: SHADES[n === 0 ? 0 : n < 3 ? 1 : n < 5 ? 2 : 3] }; }),
      repos: [
        { name: 'insightsHubV2', count: 96, pct: 100 },
        { name: 'insight_hub', count: 71, pct: 74 },
        { name: 'socratese', count: 34, pct: 35 }
      ],
      tabs: [
        { label: 'HOME', color: '#a69dbd', bg: 'transparent' },
        { label: 'JOURNAL', color: '#f2b632', bg: '#2e2945' },
        { label: 'HERO', color: '#a69dbd', bg: 'transparent' },
        { label: 'ARENA', color: '#a69dbd', bg: 'transparent' },
        { label: 'SETTINGS', color: '#a69dbd', bg: 'transparent' }
      ]
    };
  }
}
</script>
</body>
</html>
